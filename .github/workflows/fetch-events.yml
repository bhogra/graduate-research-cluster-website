name: Fetch Events

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch events from Google Calendar
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          curl -s "https://www.googleapis.com/calendar/v3/calendars/${{ secrets.CALENDAR_ID }}/events?key=${{ secrets.GOOGLE_API_KEY }}&timeMin=${NOW}&orderBy=startTime&singleEvents=true&maxResults=20" \
            -o events.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --staged --quiet || (git commit -m "update events" && git push)
